# 本地开发环境：仅 infra（mysql + redis），imserver 本地原生运行直连 127.0.0.1。
# 账号库名与 docker-compose.yml（内部署）保持一致：IMS_jack / IMS_reactor_db。
# 命名为 compose.dev.yaml（非 compose.yaml）以免被 docker compose 默认发现机制
# 选中——默认 `docker compose up` 必须走 docker-compose.yml 全栈，本文件须显式 -f。
# 用法: docker compose -f compose.dev.yaml up -d
# 注意：mysql 8.0→8.4 升级需重建卷：docker compose -f compose.dev.yaml down -v && docker compose -f compose.dev.yaml up -d
services:
  redis:
    image: redis:8-alpine
    container_name: ims-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data

  mysql:
    image: mysql:8.4
    container_name: ims-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${IM_MYSQL_PASSWORD:-change-me}
      MYSQL_DATABASE: IMS_reactor_db
      MYSQL_USER: IMS_jack
      MYSQL_PASSWORD: ${IM_MYSQL_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    container_name: ims-minio
    restart: unless-stopped
    # 本地原生 imserver 直连 127.0.0.1:9000 做对象存储集成测试
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${IM_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${IM_S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio-data:/data

  # 一次性建桶（本地原生 imserver 直连 127.0.0.1:9000 用）：minio 起来后
  # 创建 bucket media（已存在忽略），幂等跑完即退。
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      TZ: Asia/Shanghai
      MS3AK: ${IM_S3_ACCESS_KEY:-minioadmin}
      MS3SK: ${IM_S3_SECRET_KEY:-minioadmin}
      MS3BUCKET: ${IM_S3_BUCKET:-media}
    entrypoint: ["/bin/sh", "-c",
      "until mc alias set m http://minio:9000 \"$$MS3AK\" \"$$MS3SK\"; do sleep 1; done; mc mb -p \"m/$$MS3BUCKET\" || true"]

volumes:
  redis-data:
  mysql-data:
  minio-data:
