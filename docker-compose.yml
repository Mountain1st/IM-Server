# IM 服务器容器编排：imserver + mysql + redis（redis 预留，接入后启用）
# 用法: docker compose up -d --build
# 数据卷 mysql_data 持久化消息/用户；imserver 等待 MySQL 健康后启动。
# 角色：内部署全栈（mysql + redis + imserver）；本地开发仅 infra 请用 compose.yaml。

services:
  mysql:
    image: mysql:8.4
    environment:
      # 时区统一 UTC+8：NOW()/CURRENT_TIMESTAMP（users.created_at 等
      # TIMESTAMP 列）按北京时间求值；TIMESTAMP 物理存 UTC、读取随
      # 会话时区，改 TZ 后旧数据读取自动偏移为北京时间（修正历史错位）
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${IM_MYSQL_PASSWORD:-change-me}
      MYSQL_DATABASE: IMS_reactor_db
      MYSQL_USER: IMS_jack
      MYSQL_PASSWORD: ${IM_MYSQL_PASSWORD:-change-me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化时自动建表（幂等，schema.sql 含 CREATE TABLE IF NOT EXISTS）
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    # 预留：Redis 接入（token/presence/限流/幂等）后由 imserver 通过服务名连接
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    # 访问日志时间按北京时间（与 imserver 日志/MySQL NOW() 一致）
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/im.conf:/etc/nginx/conf.d/im.conf:ro
    depends_on:
      - imserver

  imserver:
    build: .
    # 自动拉起：MySQL 启动慢/闪断时 imserver fail-fast 退出后自动重试
    # 直到连上（配合 depends_on healthy 消除启动顺序问题）
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "9191:9191"
    environment:
      IM_MYSQL_HOST: mysql
      IM_MYSQL_PORT: "3306"
      IM_MYSQL_USER: IMS_jack
      IM_MYSQL_PASSWORD: ${IM_MYSQL_PASSWORD:-change-me}
      IM_MYSQL_DB: IMS_reactor_db
      # Redis：token 等存储落到 Redis（容器内通过服务名 redis 访问 6379）
      IM_REDIS_ENABLED: "1"
      IM_REDIS_HOST: redis
      IM_REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9191/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data: