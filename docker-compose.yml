# IM 服务器容器编排：mysql + redis + imserver + nginx（部署标准）
# 用法: docker compose up -d --build
# 数据卷 mysql_data 持久化消息/用户；imserver 等待 MySQL 健康后启动。
# 部署标准（按远程生产机固化，后续改进以此为准）：
#   - 连接数上限 50（2C2G 实测配置，imserver 启动参数）
#   - imserver 仅绑 127.0.0.1:9191——不对公网直接暴露，一律经 Nginx(8080)
#   - IM_TRUSTED_PROXIES=网桥 IP（信任 Nginx 的 X-Forwarded-For；
#     不同机器网段可能不同：docker network inspect <网络名> 核对 Gateway）
#   - MySQL buffer pool 128M（2G 内存约束）
#   - 密码经 .env 注入（IM_MYSQL_PASSWORD=...，git-ignored；
#     compose 自动读取同目录 .env 文件）
# 本地开发仅 infra 请用 compose.yaml。

services:
  mysql:
    image: mysql:8.4
    environment:
      # 时区统一 UTC+8：NOW()/CURRENT_TIMESTAMP（users.created_at 等
      # TIMESTAMP 列）按北京时间求值；TIMESTAMP 物理存 UTC、读取随
      # 会话时区，改 TZ 后旧数据读取自动偏移为北京时间（修正历史错位）
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${IM_MYSQL_PASSWORD:-change-me}
      MYSQL_DATABASE: IMS_reactor_db
      MYSQL_USER: IMS_jack
      MYSQL_PASSWORD: ${IM_MYSQL_PASSWORD:-change-me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 2C2G 内存约束：buffer pool 收敛 128M（缺省 128M+，2G 机器易 OOM）
      - --innodb-buffer-pool-size=128M
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次初始化时自动建表（幂等，schema.sql 含 CREATE TABLE IF NOT EXISTS）
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # 注意 $$ 转义：容器内 shell 展开 MYSQL_ROOT_PASSWORD；
      # 单 $ 会被 compose 在解析期插值成空串，fresh 部署健康检查必挂
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8-alpine
    # Redis：token/presence/限流/幂等，imserver 通过服务名连接
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    # 访问日志时间按北京时间（与 imserver 日志/MySQL NOW() 一致）
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/im.conf:/etc/nginx/conf.d/im.conf:ro
    depends_on:
      - imserver

  imserver:
    build: .
    # 自动拉起：MySQL 启动慢/闪断时 imserver fail-fast 退出后自动重试
    # 直到连上（配合 depends_on healthy 消除启动顺序问题）
    restart: unless-stopped
    # 部署标准启动参数：端口 / IO 线程 2 / 工作线程 3 / 最大连接 50
    command: ["9191", "2", "3", "50"]
    environment:
      TZ: Asia/Shanghai
      IM_MYSQL_HOST: mysql
      IM_MYSQL_PORT: "3306"
      IM_MYSQL_USER: IMS_jack
      IM_MYSQL_PASSWORD: ${IM_MYSQL_PASSWORD:-change-me}
      IM_MYSQL_DB: IMS_reactor_db
      # Redis：token 等存储落到 Redis（容器内通过服务名 redis 访问 6379）
      IM_REDIS_ENABLED: "1"
      IM_REDIS_HOST: redis
      IM_REDIS_PORT: "6379"
      # 信任 Nginx 反代的 X-Forwarded-For（网桥 IP；不同机器网段核对方式
      # 见文件头注释）
      IM_TRUSTED_PROXIES: 172.19.0.1
      # 经 Nginx 反代时对端 IP 恒为网桥（全体用户共享同一"单 IP"额度），
      # 服务端单 IP 限连关闭；入口限流交给 Nginx perip 50（im.conf 已含）。
      # 总量仍有 command 的连接上限 50 兜底
      IM_MAX_PER_IP_CONN: "0"
    # 仅绑 127.0.0.1：不经 Nginx 的直连通道不暴露公网（对外入口只有
    # Nginx 的 8080）
    ports:
      - "127.0.0.1:9191:9191"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9191/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
