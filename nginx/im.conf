# IM 服务端 Nginx 反向代理配置
# 用法一（裸机）：放入 /etc/nginx/conf.d/ 后 nginx -s reload
# 用法二（Docker）：docker-compose.yml 的 nginx 服务挂载本文件
# 验证：bash scripts/test_biz.sh 直连 9191 + python3 scripts/biz_test.py <域名/主机> <端口>

upstream im_backend {
    # Docker Compose（默认语境）：nginx 与 imserver 同容器网络
    server imserver:9191;
    # 裸机同机部署：注释上一行，启用下一行
    # server 127.0.0.1:9191;
}

# 每真实 IP 连接计数的共享区（本文件被 include 于 http 块，属 http 级配置）
limit_conn_zone $binary_remote_addr zone=perip:10m;

# ---- 方案 A：HTTP（ws://，开箱即用/内网/联调）----
server {
    listen 8080;
    # server_name im.example.com;   # 按域名部署时启用

    # 每真实 IP 连接数限制（替代服务端 IM_MAX_PER_IP_CONN=0 后的入口限流）
    limit_conn perip 50;

    location / {
        proxy_pass http://im_backend;
        # WebSocket 升级三件套
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 透传真实客户端 IP（服务端配 IM_TRUSTED_PROXIES=<本Nginx的IP> 后生效）
        proxy_set_header X-Forwarded-For $remote_addr;
        # 超时须大于服务端僵尸判定（60s）：心跳 30s 场景 90s 留余量
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
    }

    location /health {
        proxy_pass http://im_backend;
        access_log off;
    }

    # 图片静态文件（只读目录服务；命名模式与服务端对象键/GC 一致，
    # 仅服务 ^[0-9a-f]{64}.(png|jpg|jpeg|gif|webp)$，其余一律 404，
    # 防 .tmp/非法名/误放文件被 serving）
    location ~ "^/uploads/([0-9a-f]{64}\.(png|jpg|jpeg|gif|webp))$" {
        alias /var/lib/imserver/uploads/$1;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    location /uploads/ {
        return 404;
    }
}

