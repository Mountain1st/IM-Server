name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 一次性 CI 容器的密码（run 结束即焚，无生产价值；源码/模板已脱敏）
      IM_MYSQL_PASSWORD: "520010"
      # 媒体对象存储（MinIO）测试配置：媒体用例据此启用，未设则整段 SKIP
      IM_S3_ENDPOINT: "127.0.0.1:9000"
      IM_S3_REGION: "us-east-1"
      IM_S3_BUCKET: "media"
      IM_S3_ACCESS_KEY: "minioadmin"
      IM_S3_SECRET_KEY: "minioadmin"
      IM_S3_PATH_STYLE: "true"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 520010
          MYSQL_DATABASE: IMS_reactor_db
          MYSQL_USER: IMS_jack
          MYSQL_PASSWORD: 520010
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot_520010"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev libhiredis-dev libboost-dev libcurl4-openssl-dev

      - name: 启动 MinIO（静态二进制，免 Docker 镜像分发策略）
        run: |
          # 方案 A：与本地验证方式同构——不用 Docker service，直接跑官方静态
          # 二进制（minio/minio 镜像匿名拉取被拒，见 2026-10-02 CI run）。
          set -e
          echo "---- 1. 下载 MinIO / mc（dl.min.io，curl -f 下载失败立即终止）----"
          curl -fsSL -o /tmp/minio https://dl.minio.org.cn/server/minio/release/linux-amd64/minio
          chmod +x /tmp/minio
          /tmp/minio --version
          curl -fsSL -o /tmp/mc https://dl.minio.org.cn/client/mc/release/linux-amd64/mc
          chmod +x /tmp/mc
          /tmp/mc --version

          echo "---- 2. 后台启动 MinIO（监听 127.0.0.1:9000，job 期间常驻）----"
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup /tmp/minio server /tmp/minio-data \
            --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 \
            > /tmp/minio.log 2>&1 &
          echo $! > /tmp/minio.pid
          sleep 2
          ps -p "$(cat /tmp/minio.pid)" > /dev/null || { echo "MinIO 进程未存活"; cat /tmp/minio.log; exit 1; }

          echo "---- 3. readiness 轮询（30s 超时必须失败，不静默）----"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null 2>&1; then
              echo "MinIO is ready (第 ${i} 次探测)"
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "MinIO readiness 超时"; cat /tmp/minio.log; exit 1
          fi

          echo "---- 4. mc 建 media bucket（幂等）----"
          /tmp/mc alias set m http://127.0.0.1:9000 minioadmin minioadmin
          /tmp/mc mb -p m/media
          /tmp/mc ls m/

      - name: 等待并初始化数据库
        run: |
          # 等待 MySQL 服务就绪（容器 health 后仍需几秒完成初始化）
          for i in $(seq 1 30); do
            MYSQL_PWD=520010 mysql -h 127.0.0.1 -u IMS_jack IMS_reactor_db \
              -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          MYSQL_PWD=520010 mysql -h 127.0.0.1 -u IMS_jack IMS_reactor_db < db/schema.sql
          # media 表与 messages.media_id 迁移（幂等；schema.sql 已含，此处兼容旧库路径）
          MYSQL_PWD=520010 mysql -h 127.0.0.1 -u IMS_jack IMS_reactor_db < db/migrate_media.sql || true
          # 建业务回归所需表外环境（真实数据表结构以 schema.sql 为准）
          MYSQL_PWD=520010 mysql -h 127.0.0.1 -u IMS_jack IMS_reactor_db \
            -e "SELECT COUNT(*) FROM users"

      - name: 构建
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: 单元测试
        run: ctest --test-dir build --output-on-failure

      - name: 业务回归（内存模式）
        run: IM_SERVER_BIN=./build/imserver bash scripts/test_biz.sh

      - name: 业务回归（Redis 模式）
        run: |
          IM_REDIS_ENABLED=1 IM_REDIS_PORT=6379 \
            IM_SERVER_BIN=./build/imserver bash scripts/test_biz.sh

      - name: Sanitizer（ASan+UBSan）
        run: |
          cmake -B build-asan -DIM_SANITIZE=ON
          cmake --build build-asan -j"$(nproc)"
          ctest --test-dir build-asan --output-on-failure
          IM_SERVER_BIN=./build-asan/imserver ASAN_OPTIONS=detect_leaks=1 \
            bash scripts/test_biz.sh
          ! grep -qE 'AddressSanitizer|runtime error' server.log

      - name: 清理 MinIO 后台进程
        if: always()
        run: |
          # job 收尾：停止 MinIO（避免 runner 悬挂进程拖慢回收）
          if [ -f /tmp/minio.pid ]; then
            kill "$(cat /tmp/minio.pid)" 2>/dev/null || true
            sleep 1
            kill -9 "$(cat /tmp/minio.pid)" 2>/dev/null || true
          fi
          echo "MinIO 已清理"
