services:
  redis:
    image: redis:7
    container_name: ims-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data

  mysql:
    image: mysql:8.0
    container_name: ims-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 520010
      MYSQL_DATABASE: IM_reactor_db
      MYSQL_USER: IM_jack
      MYSQL_PASSWORD: 520010
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  redis-data:
  mysql-data: